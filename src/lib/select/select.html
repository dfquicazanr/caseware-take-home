<span class="label" [id]="id + '-label'" (click)="focus()">{{ label() }}</span>
<div
  #trigger
  class="trigger"
  role="combobox"
  [attr.tabindex]="disabled() ? -1 : 0"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  [attr.aria-invalid]="unknownValue() ? 'true' : null"
  [attr.aria-describedby]="unknownValue() ? id + '-error' : null"
  aria-haspopup="listbox"
  [attr.aria-labelledby]="id + '-label'"
  [attr.aria-controls]="id + '-listbox'"
  [style.anchor-name]="anchorName"
  [attr.aria-expanded]="expanded()"
  [attr.aria-activedescendant]="activeId()"
  (keydown)="onKeydown($event)"
  (click)="onTriggerClick()"
  (blur)="onBlur()"
>
  {{ selected()?.label ?? placeholder() }}
</div>
<ul
  #listbox
  class="listbox"
  role="listbox"
  popover="manual"
  tabindex="-1"
  [id]="id + '-listbox'"
  [attr.aria-labelledby]="id + '-label'"
  [style.position-anchor]="anchorName"
  (mousedown)="$event.preventDefault()"
>
  @if (expanded()) {
    @for (option of options(); track $index) {
      <li
        class="option"
        role="option"
        [id]="optionId($index)"
        [attr.aria-selected]="option === selected()"
        [attr.aria-disabled]="option.disabled ? 'true' : null"
        [class.active]="$index === activeIndex()"
        (click)="onOptionClick($index)"
      >
        {{ option.label }}
      </li>
    }
  }
</ul>
@if (unknownValue()) {
  <span class="error" [id]="id + '-error'">{{ unknownValueMessage() }}</span>
}
